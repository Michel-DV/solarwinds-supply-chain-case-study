name: Publish SolarWinds case study

on:
  push:
    branches: [main]
    paths:
      - "report/source.html"
      - "report/analysis-v1.1.html"
      - "report/cover.html"
      - "RELEASE_NOTES.md"
      - ".github/workflows/publish-report.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: solarwinds-publication
  cancel-in-progress: false

env:
  RELEASE_TAG: v1.1.0
  PDF_PATH: report/SolarWinds_Supply_Chain_Case_Study_Michel-DV.pdf
  ASSEMBLED_SOURCE: report/source-v1.1.html
  BODY_PDF: report/.body.generated.pdf
  COVER_PDF: report/.cover.generated.pdf

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout publication
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Assemble v1.1 publication source
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          base_path = Path("report/source.html")
          analysis_path = Path("report/analysis-v1.1.html")
          out_path = Path("report/source-v1.1.html")

          source = base_path.read_text(encoding="utf-8")
          analysis = analysis_path.read_text(encoding="utf-8").strip()

          marker = '''<section class="page">
            <div class="section-head"><div class="eyebrow">Appendix</div><h1>14. Common myths, indicators and terminology</h1></div>'''
          if marker not in source:
              raise SystemExit("Appendix insertion marker not found")

          source = source.replace(marker, analysis + "\n\n" + marker, 1)
          source = source.replace("v1.0.0", "v1.1.0")
          source = source.replace("14. Common myths, indicators and terminology", "17. Common myths, indicators and terminology")
          source = source.replace("<span>@Michel-DV | Appendix</span><span>14</span>", "<span>@Michel-DV | Appendix</span><span>17</span>")
          source = source.replace("15. Evidence trail", "18. Evidence trail")
          source = source.replace("<strong>Version:</strong> 1.0.0", "<strong>Version:</strong> 1.1.0")
          source = source.replace("<strong>Published:</strong> 14 September 2026", "<strong>Published:</strong> 15 September 2026")

          out_path.write_text(source, encoding="utf-8")
          print(f"Assembled {out_path} with final analytical sections")
          PY
          test -s "$ASSEMBLED_SOURCE"

      - name: Locate Chrome
        id: chrome
        shell: bash
        run: |
          set -euo pipefail
          for candidate in google-chrome-stable google-chrome chromium chromium-browser; do
            if command -v "$candidate" >/dev/null 2>&1; then
              echo "bin=$(command -v "$candidate")" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          done
          echo "Chrome/Chromium not found on runner" >&2
          exit 1

      - name: Render body and cover
        shell: bash
        run: |
          set -euo pipefail
          CHROME="${{ steps.chrome.outputs.bin }}"
          "$CHROME" \
            --headless=new \
            --no-sandbox \
            --disable-gpu \
            --allow-file-access-from-files \
            --no-pdf-header-footer \
            --print-to-pdf="$GITHUB_WORKSPACE/$BODY_PDF" \
            "file://$GITHUB_WORKSPACE/$ASSEMBLED_SOURCE"
          "$CHROME" \
            --headless=new \
            --no-sandbox \
            --disable-gpu \
            --allow-file-access-from-files \
            --no-pdf-header-footer \
            --print-to-pdf="$GITHUB_WORKSPACE/$COVER_PDF" \
            "file://$GITHUB_WORKSPACE/report/cover.html"
          test -s "$BODY_PDF"
          test -s "$COVER_PDF"

      - name: Replace generated cover page
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --quiet pypdf
          python - <<'PY'
          from pypdf import PdfReader, PdfWriter
          from pathlib import Path

          body_path = Path("report/.body.generated.pdf")
          cover_path = Path("report/.cover.generated.pdf")
          out_path = Path("report/SolarWinds_Supply_Chain_Case_Study_Michel-DV.pdf")

          body = PdfReader(str(body_path))
          cover = PdfReader(str(cover_path))
          if len(body.pages) < 2:
              raise SystemExit("Generated body PDF has fewer than 2 pages")
          if len(cover.pages) < 1:
              raise SystemExit("Generated cover PDF has no pages")

          writer = PdfWriter()
          writer.add_page(cover.pages[0])
          for page in body.pages[1:]:
              writer.add_page(page)

          with out_path.open("wb") as f:
              writer.write(f)
          PY
          rm -f "$BODY_PDF" "$COVER_PDF"
          test -s "$PDF_PATH"

      - name: Write integrity checksum
        shell: bash
        run: |
          set -euo pipefail
          cd report
          sha256sum "$(basename "$PDF_PATH")" > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Commit generated publication
        id: commit
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "M. D. V."
          git config user.email "232046078+Michel-DV@users.noreply.github.com"
          git add "$PDF_PATH" report/SHA256SUMS.txt "$ASSEMBLED_SOURCE"
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "release: publish final SolarWinds case study v1.1.0"
            git push origin HEAD:main
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Create or refresh v1.1.0 release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git fetch origin main --tags
          TARGET_SHA=$(git rev-parse origin/main)
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" "$PDF_PATH#SolarWinds Supply-Chain Case Study PDF" --clobber
            gh release edit "$RELEASE_TAG" \
              --title "SolarWinds Supply-Chain Case Study - v1.1.0" \
              --notes-file RELEASE_NOTES.md
          else
            gh release create "$RELEASE_TAG" \
              "$PDF_PATH#SolarWinds Supply-Chain Case Study PDF" \
              --target "$TARGET_SHA" \
              --title "SolarWinds Supply-Chain Case Study - v1.1.0" \
              --notes-file RELEASE_NOTES.md
          fi

      - name: Publication summary
        shell: bash
        run: |
          {
            echo "## SolarWinds publication — final analytical edition"
            echo
            echo "- PDF: \`$PDF_PATH\`"
            echo "- Release: \`$RELEASE_TAG\`"
            echo "- SHA-256: \`$(cut -d' ' -f1 report/SHA256SUMS.txt)\`"
            echo "- Author: \`@Michel-DV\`"
            echo "- Added: trust-path reconstruction, detection hypotheses, Red Team research notes"
            echo "- Status: final analytical edition"
          } >> "$GITHUB_STEP_SUMMARY"
