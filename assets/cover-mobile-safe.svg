  <text x="72" y="570" fill="#eef9ff" font-family="Arial,Helvetica,sans-serif" font-size="74" font-weight="700" letter-spacing="1">SOLARWINDS</text>
  <text x="74" y="628" fill="#ff4658" font-family="Arial,Helvetica,sans-serif" font-size="32" font-weight="700" letter-spacing="4">SUPPLY-CHAIN COMPROMISE</text>
