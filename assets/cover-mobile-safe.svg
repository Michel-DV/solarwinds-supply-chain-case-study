<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="800" viewBox="0 0 1600 800">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#06131f"/>
      <stop offset="0.48" stop-color="#0b1a29"/>
      <stop offset="0.52" stop-color="#171521"/>
      <stop offset="1" stop-color="#18090f"/>
    </linearGradient>
    <radialGradient id="blue" cx="23%" cy="40%" r="55%">
      <stop offset="0" stop-color="#1bbcff" stop-opacity=".25"/>
      <stop offset="1" stop-color="#1bbcff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="red" cx="78%" cy="40%" r="58%">
      <stop offset="0" stop-color="#ff2c45" stop-opacity=".28"/>
      <stop offset="1" stop-color="#ff2c45" stop-opacity="0"/>
