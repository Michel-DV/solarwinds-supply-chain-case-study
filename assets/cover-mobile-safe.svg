    <path d="M840 230 C1080 75 1310 105 1510 220" stroke="#ff3a50" stroke-opacity=".74"/>
    <path d="M840 305 C1080 200 1290 270 1510 440" stroke="#ff3a50" stroke-opacity=".60"/>
    <path d="M840 355 C1060 490 1280 495 1510 610" stroke="#ff3a50" stroke-opacity=".42"/>
