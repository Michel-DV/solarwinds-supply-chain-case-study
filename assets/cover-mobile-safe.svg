    <linearGradient id="stroke" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#31c7ff"/>
      <stop offset=".55" stop-color="#6bdcff"/>
      <stop offset="1" stop-color="#ff425d"/>
