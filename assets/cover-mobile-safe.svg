    <rect x="22" y="22" width="576" height="206" rx="16" fill="#09121b" stroke="#8bb7c9" stroke-opacity=".10"/>

    <circle cx="82" cy="86" r="33" fill="#0d2434" stroke="#35c7ff" stroke-width="3"/>
    <circle cx="82" cy="86" r="12" fill="#dff7ff"/>
    <circle cx="82" cy="86" r="5" fill="#0d2434"/>

    <text x="145" y="82" fill="#f4f9fc" font-family="Arial,Helvetica,sans-serif" font-size="28" font-weight="700">TRUSTED UPDATE</text>
    <text x="145" y="116" fill="#80b6cf" font-family="Consolas,monospace" font-size="17">signed · verified · deployed</text>

    <line x1="48" y1="150" x2="572" y2="150" stroke="#6b8998" stroke-opacity=".52" stroke-width="2"/>
    <rect x="48" y="170" width="524" height="40" rx="8" fill="#0c1722" stroke="#7998a8" stroke-opacity=".14"/>
    <text x="70" y="196" fill="#ff4258" font-family="Consolas,monospace" font-size="19">// hidden backdoor</text>
